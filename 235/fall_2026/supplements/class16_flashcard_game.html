<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pruning Flashcard Game</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one centered column; a home screen with three game modes, each mode swaps into the same stage. */
:root{
  --bg:#f3f5ef; --surface:#ffffff; --surface2:#e8ede2; --fg:#1b2a22; --muted:#5b6b61;
  --line:#cdd6c8; --accent:#1f6b4a; --accent-fg:#ffffff; --cut:#c2641a; --good:#1d7a4a; --bad:#b3342b;
  --good-bg:#dcf0e3; --bad-bg:#f6dcd8; --code-bg:#e4eadd;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101a15; --surface:#18251e; --surface2:#213229; --fg:#e6efe8; --muted:#97a99d;
    --line:#2f4438; --accent:#6fcf9b; --accent-fg:#0e1a13; --cut:#f0a45f; --good:#6fcf9b; --bad:#f08a80;
    --good-bg:#1c3b2b; --bad-bg:#432421; --code-bg:#243a2d; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101a15; --surface:#18251e; --surface2:#213229; --fg:#e6efe8; --muted:#97a99d;
  --line:#2f4438; --accent:#6fcf9b; --accent-fg:#0e1a13; --cut:#f0a45f; --good:#6fcf9b; --bad:#f08a80;
  --good-bg:#1c3b2b; --bad-bg:#432421; --code-bg:#243a2d; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
code{font-family:var(--mono);font-size:.92em;background:var(--code-bg);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--cut);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none}
.brand h1{font-size:1.5rem;font-weight:800}
.brand p{margin:0;color:var(--muted);font-size:.85rem}
.home-btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:500}
.home-btn:hover{background:var(--surface2)}
.lede{margin:0;color:var(--muted);max-width:60ch}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.mode{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.mode:hover{border-color:var(--accent);transform:translateY(-2px)}
.mode h2{font-size:1.25rem;font-weight:800;color:var(--accent)}
.mode p{margin:0;color:var(--muted);font-size:.92rem}
.mode .best{margin-top:auto;font-size:.82rem;font-family:var(--mono);color:var(--fg)}
.mode{transition:transform .15s,border-color .15s}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.bar .grow{flex:1;min-width:120px}
.meter{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.stat{font-family:var(--mono);color:var(--fg)}
.lives{letter-spacing:3px;color:var(--cut)}
/* study */
.flip{perspective:1200px;cursor:pointer;border:0;background:none;padding:0;text-align:left;width:100%}
.flip-in{display:grid;transition:transform .45s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;min-height:19rem;border-radius:14px;padding:22px;
  display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.face.q{background:var(--surface)}
.face.a{background:var(--surface2);transform:rotateY(180deg);border-color:var(--accent)}
.tag{font-family:var(--mono);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.face .text{font-size:1.2rem;line-height:1.5;margin:auto 0}
.face.a .text{font-size:1.1rem}
.hint{font-size:.8rem;color:var(--muted);margin-top:auto}
.row{display:flex;gap:12px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:12px 18px;border-radius:10px;font-weight:600;flex:1;min-width:130px}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.miss{border-color:var(--cut);color:var(--cut)}
.btn[disabled]{opacity:.45;cursor:default}
/* quiz */
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:16px}
.qcard h2{font-size:1.3rem;font-weight:600;font-family:var(--body);line-height:1.45}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 14px;min-width:0;align-items:flex-start}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font-family:var(--mono);color:var(--muted);flex:none}
.opt span:last-child{min-width:0;overflow-wrap:anywhere}
.opt.good{background:var(--good-bg);border-color:var(--good)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.note{font-size:.95rem;padding:10px 14px;border-radius:10px;background:var(--surface2)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.flip:focus-visible{outline:3px solid var(--cut);outline-offset:3px}
.pop{animation:pop .25s}
@keyframes pop{0%{transform:scale(.97)}100%{transform:scale(1)}}
/* match */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.tile{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:.88rem;min-width:0;overflow-wrap:anywhere}
.tile:hover:not([disabled]){border-color:var(--accent)}
.tile.sel{border-color:var(--cut);box-shadow:0 0 0 2px var(--cut)}
.tile.done{background:var(--good-bg);border-color:var(--good);opacity:.55;cursor:default}
.tile.shake{animation:shake .3s;border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.result{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:14px}
.result h2{font-size:1.8rem;font-weight:800}
.big{font-family:var(--mono);font-size:2.2rem;color:var(--accent)}
.review{display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.review li{margin-bottom:6px}
.review ul{margin:0;padding-left:20px}
@media (max-width:520px){.mgrid{gap:8px}.tile{font-size:.8rem;padding:8px}.face{padding:16px}.face .text{font-size:1.05rem}}
@media (prefers-reduced-motion:reduce){.flip-in,.mode,.meter i{transition:none}.pop,.tile.shake{animation:none}}
</style>
</head>
<body>

<main>
  <div class="top">
    <div class="brand">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
        <path d="M20 36V20M20 20L9 11M20 20L31 11M9 11L4 4M9 11L14 4" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" fill="none"/>
        <path d="M31 11L36 4" stroke="var(--cut)" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 5" fill="none"/>
        <circle cx="20" cy="36" r="3" fill="var(--accent)"/>
      </svg>
      <div><h1>Pruning Flashcard Game</h1><p>CSCI 235 &bull; Class 16 &bull; 36 cards</p></div>
    </div>
    <button class="home-btn" id="homeBtn" hidden>Home</button>
  </div>
  <div id="stage"></div>
</main>

<script>
const CARDS=[["Two savings", "What is the difference between early termination and pruning?", "**Early termination** stops the entire search after finding a satisfactory solution.\n\n**Pruning** skips a branch that cannot help: either it cannot succeed (**infeasibility pruning**), or exploring it would add nothing new (**duplicate-state pruning**)."], ["Short circuit", "Why does a recursive search using `||` stop after finding a solution?", "C++ uses **short-circuit evaluation**. When the first recursive call in `a || b` returns `true`, the second call is **not evaluated**. The `true` then propagates upward: each active call returns `true` to its caller, so the whole search stops."], ["Safe pruning", "What is the key rule for safe pruning?", "Never discard a branch unless you can **justify** it.\n\n**Infeasibility pruning:** the branch cannot contain a valid solution.\n\n**Duplicate-state pruning:** an equivalent state has already been explored, so this branch adds no new outcome that the search needs."], ["When rem < 0 works", "When is the condition `rem < 0` safe for subset-sum search?", "When all remaining numbers are **nonnegative**. Adding more of them cannot bring a negative remainder back to zero."], ["Unsafe pruning", "Why is `rem < 0` unsafe when negative numbers are allowed?", "A negative number might bring the remainder back to zero.\n\nExample: remaining numbers `{5, -3}`, target 2. Taking 5 makes `rem = -3`, but taking `-3` afterward succeeds."], ["suffix[k]", "What does `suffix[k]` represent?", "The sum of all remaining numbers `v[k]` through `v[n-1]`, with `suffix[n] = 0`."], ["The bound", "Why is `rem > suffix[k]` a safe pruning condition?", "For nonnegative numbers, even taking **every** remaining number cannot reach `rem` if their total sum is too small."], ["Stopping rules", "What are the three main stopping conditions in the bounded subset-sum search?", "**1. Goal:** `rem == 0` → return `true`.\n\n**2. No numbers remain:** `k == n` → return `false`.\n\n**3. Pruning:** `rem < 0 || rem > suffix[k]` → return `false`.\n\nThe pruning tests assume all remaining numbers are nonnegative."], ["Suffix sums", "For `v = {5,4,3,2,1}`, what is `suffix[0..5]`?", "`{15, 10, 6, 3, 1, 0}`"], ["Target 20", "For `v = {5,4,3,2,1}`, why does target 20 take only one call?", "Because `rem = 20` exceeds `suffix[0] = 15`. The root call immediately rejects the branch."], ["A state", "What is one state in the pair-selection Make 24 search?", "The collection of numbers currently on the table. A move replaces two selected numbers with one result, reducing the number of entries by one."], ["Why i < j", "Why does the Make 24 search choose pairs with `i < j`?", "It chooses each **unordered pair once**, avoiding a redundant second selection of the same two entries."], ["Six choices", "What six operation choices are tried for a selected pair `a, b`?", "`a+b`, `a*b`, `a-b`, `b-a`, `a/b`, and `b/a`.\n\nDivision choices are skipped when their denominators are zero or too close to zero."], ["Order matters", "Why are both subtraction and division orders needed?", "They are generally **noncommutative**.\n\nIn contrast, reversing the operands of addition or multiplication does not change the result."], ["First moves", "How many first moves are possible with four numbers, assuming all six operations?", "C(4, 2)× 6 = 6× 6 = 36."], ["Sequences", "Assuming all six operations are available at every step, how many complete candidate operation sequences are there for four numbers?", "36× 18× 6 = 3,888 candidate sequences, counted **before** invalid-division filtering, duplicate elimination, or early termination.\n\nAn actual solver may explore fewer."], ["Duplicate state", "What is a duplicate state in Make 24?", "A state containing the same remaining numerical values as a previously explored state, even if those values appear in a **different order**.\n\n**Scope:** for deciding whether a solution exists (or finding one solution), such states are interchangeable, assuming the same operations are available. To enumerate every distinct expression, retain distinct expression histories; do not discard them solely because their numerical states match."], ["Sorted key", "Why sort the values in a duplicate-state key?", "To make states that differ only in the order of their remaining numbers use the **same canonical key**."], ["insert().second", "What does `seen.insert(key).second` mean for a `std::set`?", "It is `true` when the key was **newly inserted**, and `false` when the key was **already present**."], ["Rounded keys", "Why can rounded floating-point state keys be unsafe?", "Two different numerical states may round to the same key. Skipping one of them could **discard a valid solution**."], ["Integer keys", "When can a sorted integer state key represent duplicates exactly?", "When the states use exact integer values and the key preserves those values without rounding or loss of precision."], ["Return before undo", "Why is returning `true` before undo sometimes safe?", "It is safe when the modified state does not need to be restored, such as a **local vector** in the Make 24 solver.\n\nIt is not automatically safe for shared state that callers expect unchanged."], ["printUnique", "What does `printUnique` use to avoid repeated permutations?", "A **local set** of characters tried at the current recursive position. It skips a character value already tried at that position."], ["Local tried set", "Why must the `tried` set be local to each recursive call?", "A character may be used at different positions, and different calls at the same depth explore different prefixes.\n\nSkip repeated character choices only within **this call's** candidate loop, and create a **fresh set for each call**."], ["AABB", "How many distinct permutations does `AABB` have?", "(4!)/(2! 2!) = 6."], ["LEVEL", "How many lines do `printAll` and `printUnique` generate for `LEVEL`?", "`printAll` prints 5! = 120 lines.\n\n`printUnique` prints (5!)/(2! 2!) = 30 distinct arrangements."], ["Unsorted input", "Must `v` be sorted for the take/skip subset-sum search?", "**No.** The search follows the order of `v`.\n\nFor `v = {4, 1, 2, 3}` and target 6, it makes **9 calls** and finds `chosen = {4, 2}`.\n\n**Assumptions for the count of 9:** the search tries **take before skip**, stops at the first success (`rem == 0`), and includes the `rem < 0` test. Without the `rem < 0` test it makes **11** calls. The subset `{1, 2, 3}` also works, but `{4, 2}` is found first.\n\nSorting is not needed. Only pruning tests such as `rem < 0` need nonnegative numbers."], ["Small bound example", "For `v = {5, 1, 2}` and target 4 (`suffix = {8, 3, 2, 0}`), how many calls are made with and without pruning?", "Without any pruning: 1+2+4+8 = 2^4-1 = 15 calls.\n\nWith both tests: **3** calls.\n\n**1.** Root: `rem = 4`.\n\n**2.** Take 5: `rem = -1`, stopped by `rem < 0`.\n\n**3.** Skip 5: `rem = 4 > suffix[1] = 3`, stopped by the bound."], ["Search call counts", "For `v = {9,8,...,1}` and target 20, how many calls does the search make with (a) no savings (full traversal), (b) early termination only, (c) early termination and `rem < 0`?", "(a) **1023**. (b) **244**. (c) **12**.\n\nThese counts assume **take before skip** and count every function entry, including the root and immediately rejected calls. \"No savings\" means full traversal: no early stop on success and no pruning.\n\nThe 12 calls reach the solution `{9, 8, 3}`. Without the `rem < 0` test, four overshooting calls keep going: 12 + 14 + 30 + 62 + 126 = 244, where 14, 30, 62, 126 are 2^k-2 for k = 4, 5, 6, 7."], ["Ordered pairs", "In Make 24 Version 1 (ordered pairs, 4 operations), why are there 12×4 = 48 first moves with four numbers?", "Think of **friends**: 4 numbers, and each number has 3 friends, so 4×3 = 12 ordered pairs (x,y). Each pair gets 4 operations (+, -, ×, ÷): 12×4 = 48.\n\nThe 4 in \"×4\" counts **operations**, not numbers. With 3 numbers left: 3×2×4 = 24. With 2 left: 2×1×4 = 8. Total: 48×24×8 = 9,216 candidate sequences, counted before invalid-division filtering, duplicate elimination, or early termination."], ["Building rest", "In the Make 24 solver, how is `rest` built for the pair at positions `i` and `j`?", "Copy every `nums[t]` with `t != i && t != j`. Compare **positions**, not values.\n\nExample: `nums = {3, 3, 8, 8}`, `i = 0`, `j = 2`. Comparing values (`nums[t] != a && nums[t] != b`) would remove all four numbers; comparing positions leaves `rest = {3, 8}`."], ["Push, test, pop", "For each result `r`, in what order do we push, test and pop on `rest`?", "`rest.push_back(r);` then `if (solve(rest)) return true;` then `rest.pop_back();`\n\nAfter the pop, `rest` is again the other numbers, ready for the next result. Without the pop, the next result is pushed on top of the previous one and `rest` grows to `{others, r1, r2}`."], ["Tolerance", "Why test `std::abs(nums[0] - 24) < 1e-9` instead of `nums[0] == 24`?", "Floating-point calculations can introduce small rounding errors. A result mathematically equal to 24 may be represented slightly above or below 24. The tolerance `1e-9` accepts such differences. It is a numerical policy for small inputs such as card values, not an exact test."], ["The state key", "How is the key `vector<long long>` built for a state, and why `llround(x * 1e6)`?", "Each number is multiplied by 10^6, rounded to a whole number, and the row of integers is sorted.\n\nScaling and rounding can map nearby values to the same integer, but nearby values can also fall into **different** rounding bins. Coarse rounding may merge distinct states and lose solutions; finer rounding may detect fewer approximate duplicates. Rounded keys do not guarantee exact state equivalence. 10^6 is a compromise."], ["Seen means no solution", "Why is `return false` correct when `seen.insert(key).second` is `false`?", "A key in `seen` proves only that the **key** was encountered before. \"No solution\" follows if (1) keys identify equivalent states **exactly**, and (2) a success returns `true` all the way out.\n\nRounded keys can collide, so (1) may fail.\n\nA visited state has **finished**: each move removes one value, so an equal-sized state cannot be an active ancestor. This does not extend to cyclic searches."], ["AAB tree", "How many calls does `printUnique(\"AAB\", 0)` make, and how many would `printAll` make?", "`printUnique`: **9** calls. `printAll`: **16** calls.\n\nAt the root, the second `A` is skipped (it saves 5 calls), and under `BAA` the second `A` is skipped again (it saves 2): 9 + 5 + 2 = 16."]].map((c,i)=>({id:i,t:c[0],q:c[1],a:c[2]}));
const QUIZ=[["Which statement correctly contrasts early termination with pruning?", "Early termination stops the whole search after a success; pruning skips a branch that cannot help", "Pruning stops the whole search after a success; early termination skips one branch", "They are two names for the same optimization", "Early termination skips branches that cannot succeed; pruning stops after the first success", 0], ["Why does `||` in a recursive search stop trying alternatives after a success?", "Short-circuit evaluation skips the right operand once the left is `true`", "The compiler deletes the other recursive calls", "`||` only ever evaluates its last operand", "Recursion cannot try more than one alternative", 1], ["Which branch may be pruned safely?", "One you can justify cannot contain a solution, or adds no new outcome because an equivalent state was explored", "One that looks unpromising after a few steps", "One that is deeper than the others", "Any branch whose first choice failed", 2], ["When is `rem < 0` a safe pruning test for subset sum?", "When all remaining numbers are nonnegative", "When the target is positive", "When the numbers are sorted", "Never; it is always unsafe", 3], ["With remaining numbers `{5, -3}` and target 2, why is `rem < 0` unsafe?", "After taking 5, `rem = -3`, but a later `-3` brings it back to 0", "Because 5 + (-3) is not 2", "Because negative numbers cannot be stored in a vector", "Because the suffix array becomes empty", 4], ["What is `suffix[k]`?", "The sum of `v[k]` through `v[n-1]`", "The sum of `v[0]` through `v[k]`", "The largest value among `v[k]` through `v[n-1]`", "The number of remaining elements", 5], ["Why is `rem > suffix[k]` a safe prune for nonnegative numbers?", "Even taking every remaining number cannot reach `rem`", "Taking every remaining number would overshoot `rem`", "The remaining numbers must be sorted", "It means the target was already reached", 6], ["Which is the pruning test in the bounded subset-sum search?", "`rem < 0 || rem > suffix[k]`", "`rem == 0 || k == n`", "`rem > 0 && k < n`", "`rem < suffix[k]`", 7], ["For `v = {5,4,3,2,1}`, what is `suffix[0..5]`?", "`{15, 10, 6, 3, 1, 0}`", "`{5, 9, 12, 14, 15, 0}`", "`{15, 14, 12, 9, 5, 0}`", "`{15, 10, 6, 3, 1}`", 8], ["For `v = {5,4,3,2,1}` and target 20, how many calls happen, and why?", "One call: 20 exceeds `suffix[0] = 15`", "Six calls, one per element", "Twenty calls, one per unit of the target", "One call: `rem < 0`", 9], ["What is one state in the pair-selection Make 24 search?", "The numbers currently on the table", "The pair of numbers selected", "The operation chosen", "The target 24", 10], ["Why does the Make 24 search choose pairs with `i < j`?", "It picks each unordered pair once", "It prevents division by zero", "It sorts the numbers", "It guarantees the first number is larger", 11], ["Which list shows the six operation choices for a selected pair `a, b`?", "`a+b`, `a*b`, `a-b`, `b-a`, `a/b`, `b/a`", "`a+b`, `a-b`, `a*b`, `a/b`", "`a+b`, `b+a`, `a*b`, `b*a`, `a-b`, `a/b`", "`a+b`, `a*b`, `a-b`, `a/b`, `a%b`, `a^b`", 12], ["Which operations need both operand orders?", "Subtraction and division", "Addition and multiplication", "Addition and subtraction", "Only division", 13], ["How many first moves exist with four numbers and six operations?", "36", "24", "12", "6", 14], ["How many candidate operation sequences exist for four numbers (before any filtering)?", "3,888", "648", "1,296", "36", 15], ["Which two states are duplicates in Make 24?", "`{2, 3, 12}` and `{12, 2, 3}`", "`{2, 3, 12}` and `{2, 3, 13}`", "`{2, 3, 12}` and `{2, 3}`", "`{2, 3, 12}` and `{24}`", 16], ["Why sort the values in a state key?", "So states that differ only in order get the same key", "So division never divides by zero", "So rounding becomes exact", "So the smallest number is removed", 17], ["What does `seen.insert(key).second == false` mean?", "The key was already present", "The key was newly inserted", "The insertion ran out of m const $=s=>document.querySelector(s);
const stage=$('#stage'), homeBtn=$('#homeBtn');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function plain(s){return s.replace(/\{\{TREES\}\}/g,'').replace(/[`]/g,'').replace(/\*\*/g,'').replace(/\n\n/g,' ');}
function fmt(s,rich){
  s=rich?s.replace(/\{\{TREES\}\}/g,'@@TREES@@'):s.replace(/\{\{TREES\}\}/g,'');
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n\n/g,'<br><br>').replace(/@@TREES@@/g,TREES);
}
function load(k){try{return JSON.parse(localStorage.getItem('prune16.'+k))}catch(e){return null}}
function save(k,v){try{localStorage.setItem('prune16.'+k,JSON.stringify(v))}catch(e){}}
const TREES='';
let cleanup=null;
function go(fn){ if(cleanup){cleanup();cleanup=null} fn(); window.scrollTo(0,0); }
homeBtn.onclick=()=>go(home);

function home(){
  homeBtn.hidden=true;
  const bq=load('quiz'), bm=load('match2');
  stage.innerHTML=`
    <p class="lede">Practice the ideas from Class 16: early termination, safe pruning, the suffix bound, and the Make 24 pair moves, duplicate states and state keys. Pick a game.</p>
    <div class="modes" style="margin-top:16px">
      <button class="mode" data-m="study"><h2>Study deck</h2><p>Flip cards one at a time. Cards you miss come back until you know them.</p><span class="best">36 cards</span></button>
      <button class="mode" data-m="quiz"><h2>Branch Quiz</h2><p>10 multiple-choice questions. You have 3 branches. Each wrong answer prunes one.</p><span class="best">Best: ${bq!=null?bq+' pts':'none yet'}</span></button>
      <button class="mode" data-m="match"><h2>Match Rounds</h2><p>Pair each question with its answer. Three rounds of six pairs, 18 randomly selected pairs. Misses add 5 seconds. Transition delays are not timed.</p><span class="best">Best: ${bm!=null?bm+' s':'none yet'}</span></button>
    </div>`;
  stage.querySelectorAll('.mode').forEach(b=>b.onclick=()=>go({study,quiz,match}[b.dataset.m]));
}

/* ---------- Study ---------- */
function study(){
  homeBtn.hidden=false;
  let queue=shuffle(CARDS), total=CARDS.length, known=0, pass=1, flipped=false, missed=new Set();
  function render(){
    if(!queue.length){
      flipped=false;
      stage.innerHTML=`<div class="result"><h2 id="doneH" tabindex="-1">Deck complete</h2><div class="big">${total} / ${total}</div>
        <p>${missed.size?`You needed a second look at ${missed.size} card${missed.size>1?'s':''}: `+[...missed].map(i=>CARDS[i].t).join(', ')+'.':'You knew every card on the first pass.'}</p>
        <div class="row"><button class="btn pri" id="again">Study again</button><button class="btn" id="hm">Home</button></div></div>`;
      $('#again').onclick=()=>go(study); $('#hm').onclick=()=>go(home); $('#doneH').focus({preventScroll:true}); return;
    }
    const c=queue[0]; flipped=false;
    stage.innerHTML=`
      <div class="bar"><span class="stat">${known} / ${total} known</span><div class="grow meter"><i style="width:${known/total*100}%"></i></div><span>${queue.length} left</span></div>
      <div class="flip" id="card" tabindex="-1" role="group" aria-label="Flashcard: ${plain(c.t)}" style="margin-top:14px"><div class="flip-in">
        <div class="face q"><div class="tag"><span>${fmt(c.t)}</span><span>Question</span></div><div class="text">${fmt(c.q)}</div><div class="hint">Think of your answer, then click the card or press Space.</div></div>
        <div class="face a" aria-hidden="true"><div class="tag"><span>${fmt(c.t)}</span><span>Answer</span></div><div class="text">${fmt(c.a,true)}</div></div>
      </div></div>
      <div class="row" style="margin-top:14px"><button class="btn" id="flip" aria-expanded="false">Show answer (Space)</button><button class="btn miss" id="miss" disabled>Need review (&larr;)</button><button class="btn pri" id="got" disabled>Got it (&rarr;)</button></div>
      <div class="sr-only" id="sr" aria-live="polite"></div>`;
    $('#card').onclick=flip; $('#flip').onclick=flip; $('#miss').onclick=()=>next(false); $('#got').onclick=()=>next(true);
    $('#card').focus({preventScroll:true});
  }
  function flip(){ if(!queue.length) return; flipped=!flipped; $('#card').classList.toggle('on',flipped); const fb=$('#flip'); fb.textContent=flipped?'Show question (Space)':'Show answer (Space)'; fb.setAttribute('aria-expanded',String(flipped)); $('#sr').textContent=flipped?'Answer: '+plain(queue[0].a):'Question: '+plain(queue[0].q); $('.face.q').setAttribute('aria-hidden',String(flipped)); $('.face.a').setAttribute('aria-hidden',String(!flipped)); $('#miss').disabled=!flipped; $('#got').disabled=!flipped; }
  function next(ok){
    if(!flipped||!queue.length) return;
    const c=queue.shift();
    if(ok) known++; else { missed.add(c.id); queue.splice(Math.min(3,queue.length),0,c); }
    render();
  }
  const key=e=>{
    if(e.key===' '||e.key==='Enter'){ if(document.activeElement&&document.activeElement.tagName==='BUTTON') return; if(queue.length){e.preventDefault();flip()} }
    else if(e.key==='ArrowRight'){ e.preventDefault(); next(true); } else if(e.key==='ArrowLeft'){ e.preventDefault(); next(false); }
  };
  document.addEventListener('keydown',key); cleanup=()=>document.removeEventListener('keydown',key);
  render();
}

/* ---------- Quiz ---------- */
function quiz(){
  homeBtn.hidden=false;
  const qs=shuffle(QUIZ.map(z=>({z:z,c:CARDS[z[5]]}))).slice(0,10); let i=0, score=0, streak=0, lives=3, answered=false, wrongs=[];
  function render(){
    if(i>=qs.length||lives<=0) return finish();
    const item=qs[i], c=item.c; answered=false;
    const qz=item.z;
    const opts=shuffle(qz.slice(1,5).map((t,n)=>({t,ok:n===0})));
    stage.innerHTML=`
      <div class="bar"><span class="stat">Question ${i+1} / ${qs.length}</span><div class="grow meter"><i style="width:${i/qs.length*100}%"></i></div>
        <span class="stat" id="qScore">${score} pts</span><span class="lives" id="qLives" aria-label="${lives} branches left">${'●'.repeat(lives)}${'○'.repeat(3-lives)}</span></div>
      <div class="qcard pop" style="margin-top:14px"><div class="tag"><span>${fmt(c.t)}</span><span id="qStreak">${streak>1?streak+' correct in a row':''}</span></div>
        <h2 id="qh" tabindex="-1">${fmt(qz[0])}</h2>
        <div class="opts">${opts.map((o,n)=>`<button class="opt" data-ok="${o.ok?1:0}"><span class="k">${n+1}</span><span>${fmt(o.t)}</span></button>`).join('')}</div>
        <div id="fb" role="status" aria-live="polite"></div></div>`;
    stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(b,c));
    $('#qh').focus({preventScroll:true});
  }
  function updateBar(){ const sk=$('#qStreak'); if(sk) sk.textContent=streak>1?streak+' correct in a row':''; $('#qScore').textContent=score+' pts'; const L=$('#qLives'); L.textContent='●'.repeat(lives)+'○'.repeat(3-lives); L.setAttribute('aria-label',lives+' branches left'); }
  function pick(btn,c){
    if(answered) return; answered=true;
    const ok=btn.dataset.ok==='1';
    let right='', mine=btn.lastElementChild.innerHTML; stage.querySelectorAll('.opt').forEach(b=>{b.disabled=true; if(b.dataset.ok==='1'){ b.classList.add('good'); right=b.lastElementChild.innerHTML; }});
    let msg;
    if(ok){ streak++; const gain=10+Math.min(streak-1,5)*2; score+=gain; msg=`Correct. +${gain} points.`; }
    else { btn.classList.add('bad'); streak=0; lives--; wrongs.push({c,prompt:fmt(qs[i].z[0]),mine,right}); msg=`Not quite. The correct answer is: ${right}. ${lives>0?lives+(lives===1?' branch left.':' branches left.'):'No branches left.'}`; }
    updateBar();
    $('#fb').innerHTML=`<div class="note">${msg}</div><div class="row" style="margin-top:12px"><button class="btn pri" id="nx">${(i+1>=qs.length||lives<=0)?'See results':'Next question (Enter)'}</button></div>`;
    $('#nx').onclick=advance; $('#nx').focus();
  }
  function advance(){ i++; render(); }
  function finish(){
    const best=load('quiz'), isBest=best==null||score>best; if(isBest) save('quiz',score);
    stage.innerHTML=`<div class="result pop"><h2 id="doneQ" tabindex="-1">${lives<=0?'Out of branches':'Round complete'}</h2><div class="big">${score} pts</div>
      <p>${isBest?'New best score.':'Best so far: '+best+' pts.'}</p>
      ${wrongs.length?`<div class="review"><strong>Review these:</strong><ul>${wrongs.map(w=>`<li>${w.prompt}<br><span>Your answer: ${w.mine}</span><br><span>Correct answer: ${w.right}</span><br><span style="color:var(--muted)"><em>Full flashcard (${fmt(w.c.t)}):</em> ${fmt(w.c.q)}<br>${fmt(w.c.a,true)}</span></li>`).join('')}</ul></div>`:'<p>No misses.</p>'}
      <div class="row"><button class="btn pri" id="again">Play again</button><button class="btn" id="hm">Home</button></div></div>`;
    $('#again').onclick=()=>go(quiz); $('#hm').onclick=()=>go(home); $('#doneQ').focus({preventScroll:true});
  }
  const key=e=>{
    if(['1','2','3','4'].includes(e.key)){ const b=stage.querySelectorAll('.opt')[+e.key-1]; if(b&&!answered) b.click(); }
    else if(e.key==='Enter'&&answered){ const ae=document.activeElement; if(ae&&ae.tagName==='BUTTON'&&ae.id!=='nx') return; const n=$('#nx'); if(n&&ae!==n){ e.preventDefault(); n.click(); } }
  };
  document.addEventListener('keydown',key); cleanup=()=>document.removeEventListener('keydown',key);
  render();
}

/* ---------- Match ---------- */
function match(){
  homeBtn.hidden=false;
  const pool=shuffle(MATCH); let round=0, misses=0, t0=performance.now(), paused=0, pauseStart=null, timer, nextT, sel=null, left=0;
  const elapsed=()=>((pauseStart||performance.now())-t0-paused)/1000;
  function startRound(){
    if(pauseStart){ paused+=performance.now()-pauseStart; pauseStart=null; }
    const set=pool.slice(round*6,round*6+6); left=6; sel=null;
    const L=shuffle(set), R=shuffle(set);
    stage.innerHTML=`
      <div class="bar"><span class="stat">Round ${round+1} / 3</span><div class="grow meter"><i style="width:${round/3*100}%"></i></div>
        <span class="stat" id="clock">${elapsed().toFixed(1)} s</span><span class="stat" id="missCount">${misses} miss${misses===1?'':'es'}</span></div>
      <h2 id="rh" tabindex="-1" class="sr-only">Round ${round+1} of 3</h2><p class="lede" style="margin:12px 0">Click a prompt, then click its matching answer.</p><div class="sr-only" id="msr" role="status" aria-live="polite"></div>
      <div class="mgrid"><div class="mcol" id="cl">${L.map(c=>`<button class="tile" data-id="${c.id}" data-side="q" aria-pressed="false">${fmt(c.q)}</button>`).join('')}</div>
      <div class="mcol" id="cr">${R.map(c=>`<button class="tile" data-id="${c.id}" data-side="a" aria-pressed="false">${fmt(c.a)}</button>`).join('')}</div></div>`;
    stage.querySelectorAll('.tile').forEach(b=>b.onclick=()=>tap(b));
    $('#rh').focus({preventScroll:true}); say(`Round ${round+1} of 3. Six pairs.`);
  }
  function say(t){ const r=$('#msr'); if(r) r.textContent=t; }
  function setSel(x,on){ x.classList.toggle('sel',on); x.setAttribute('aria-pressed',on?'true':'false'); }
  function tap(b){
    if(b.classList.contains('done')) return;
    if(!sel){ sel=b; setSel(b,true); return; }
    if(sel===b){ setSel(b,false); sel=null; return; }
    if(sel.dataset.side===b.dataset.side){ setSel(sel,false); sel=b; setSel(b,true); return; }
    if(sel.dataset.id===b.dataset.id){
      [sel,b].forEach(x=>{setSel(x,false);x.classList.add('done');x.disabled=true;}); sel=null; left--;
      if(left){ say(`Matched. ${left} pair${left===1?'':'s'} left.`); const nx=stage.querySelector('.tile:not(.done)'); if(nx) nx.focus({preventScroll:true}); } else say(round<2?'Matched. Round complete.':'Matched. All pairs done.');
      if(!left){ stage.querySelectorAll('.tile').forEach(t=>t.disabled=true); round++; pauseStart=performance.now(); if(round>=3) done(); else nextT=setTimeout(startRound,500); }
    } else {
      misses++; const a=sel, c=b; setSel(a,false); sel=null; say('Not a match. Try again.');
      [a,c].forEach(x=>{x.classList.add('shake'); setTimeout(()=>x.classList.remove('shake'),320)});
      const m=$('#missCount'); if(m) m.textContent=misses+' miss'+(misses===1?'':'es');
    }
  }
  function done(){
    clearInterval(timer);
    const secs=elapsed(), score=Math.round((secs+misses*5)*10)/10;
    const best=load('match2'), isBest=best==null||score<best; if(isBest) save('match2',score);
    stage.innerHTML=`<div class="result pop"><h2 id="doneM" tabindex="-1">All pairs matched</h2><div class="big">${score} s</div>
      <p>${secs.toFixed(1)} s on the clock plus ${misses} miss${misses===1?'':'es'} × 5 s. ${isBest?'New best time.':'Best so far: '+best+' s.'}</p>
      <div class="row"><button class="btn pri" id="again">Play again</button><button class="btn" id="hm">Home</button></div></div>`;
    $('#again').onclick=()=>go(match); $('#hm').onclick=()=>go(home); $('#doneM').focus({preventScroll:true});
  }
  timer=setInterval(()=>{const c=$('#clock'); if(c) c.textContent=elapsed().toFixed(1)+' s'},100);
  cleanup=()=>{clearInterval(timer);clearTimeout(nextT)};
  startRound();
}

home();
</script>
</body>
